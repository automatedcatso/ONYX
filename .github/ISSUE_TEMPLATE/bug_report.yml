name: Bug report
description: Report a reproducible ONYX defect
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private messages, user emails, moderation evidence, or explicit images.
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: Commit hash or release tag
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route or workflow
      placeholder: /dashboard, listing submission, offer acceptance
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens, IDs, email addresses, message text, and secrets.
